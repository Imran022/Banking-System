name: Refresh Capitol Ledger public site
on:
  push:
    branches: [codex/capitol-ledger-live]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-public-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public disclosure snapshots
        run: node scripts/ingest.mjs
      - name: Publish refreshed static data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          git diff --cached --quiet || (git commit -m "Refresh Capitol Ledger public data" && git push)
