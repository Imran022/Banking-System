name: Refresh Capitol Ledger disclosures
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-capitol-ledger-disclosures
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/capitol-ledger-live
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull latest public disclosures
        run: node scripts/ingest.mjs
      - name: Publish data when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          git diff --cached --quiet || (git commit -m "Refresh Capitol Ledger public data" && git push origin HEAD:codex/capitol-ledger-live)
